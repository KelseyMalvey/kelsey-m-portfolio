<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11111d" />
    <meta
      name="description"
      content="Kelsey Malvey's links, work, and ways to get in touch."
    />
    <title>Kelsey Malvey | My Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-shape shape-one" aria-hidden="true"></div>
    <div class="background-shape shape-two" aria-hidden="true"></div>

    <main class="page-shell">
      <button class="theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="false">
        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5Z"></path>
        </svg>
        <span class="sr-only">Toggle color theme</span>
      </button>

      <section class="profile-card" aria-labelledby="profile-name">
        <div class="profile-photo" role="img" aria-label="Profile photo placeholder">
          <span>KM</span>
        </div>
        <p class="eyebrow">Welcome to my corner of the internet</p>
        <h1 id="profile-name">Kelsey Malvey</h1>
        <p class="bio">Customer experience strategist, curious human, and believer in making things feel a little more human.</p>

        <nav class="link-list" aria-label="Kelsey's links">
          <a class="link-button" href="https://www.linkedin.com/in/kelseymalvey" target="_blank" rel="noreferrer">
            <span class="link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M6.5 8.5A2 2 0 1 0 6.5 4.5a2 2 0 0 0 0 4ZM5 10h3v9H5v-9Zm5 0h2.9v1.23h.04c.4-.75 1.37-1.54 2.82-1.54 3.02 0 3.58 1.99 3.58 4.58V19h-3v-4.2c0-1 0-2.28-1.39-2.28-1.39 0-1.6 1.08-1.6 2.2V19h-3v-9Z"></path></svg>
            </span>
            <span>Connect on LinkedIn</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
          <a class="link-button" href="mailto:kelsey.malvey@slaloom.com">
            <span class="link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M3.5 5.5h17v13h-17v-13Zm1 1 7.5 6 7.5-6M4.5 17.5l5.1-4.3m9.9 4.3-5.1-4.3"></path></svg>
            </span>
            <span>Send me an email</span>
            <span class="arrow" aria-hidden="true">↗</span>
          </a>
        </nav>

        <footer class="site-footer">Made with <span class="spade" aria-hidden="true">♠</span> and Copilot</footer>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
